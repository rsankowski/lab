name: Update Web of Science metrics

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ vars.WOS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_wos_metrics.py
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wos-metrics.js
          git diff --cached --quiet || git commit -m "Update Web of Science metrics"
          git push
